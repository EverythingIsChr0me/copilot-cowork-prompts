<script>
  (() => {
    function youtubeEmbedUrl(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace(/^www\./, "");
        let id = "";

        if (host === "youtu.be") {
          id = parsed.pathname.slice(1).split("/")[0];
        } else if (host === "youtube.com" || host === "m.youtube.com") {
          if (parsed.pathname === "/watch") {
            id = parsed.searchParams.get("v") || "";
          } else if (parsed.pathname.startsWith("/embed/") || parsed.pathname.startsWith("/shorts/")) {
            id = parsed.pathname.split("/")[2] || "";
          }
        }

        return id ? `https://www.youtube.com/embed/${id}` : "";
      } catch {
        return "";
      }
    }

    document.querySelectorAll("#main-content h3").forEach((heading) => {
      if (heading.textContent.trim().toLowerCase() !== "demo") return;

      const target = heading.nextElementSibling;
      if (!target) return;

      const link = target.querySelector("a[href*='youtu']") || target;
      const url = link.href || link.textContent.trim();
      const embedUrl = youtubeEmbedUrl(url);
      if (!embedUrl) return;

      const frameWrap = document.createElement("div");
      frameWrap.className = "demo-embed";
      frameWrap.innerHTML = `<iframe src="${embedUrl}" title="Demo video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
      target.replaceWith(frameWrap);
    });
  })();
</script>
